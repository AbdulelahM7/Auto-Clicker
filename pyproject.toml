[project]
name = "autoclicker"
dynamic = ["version"]
description = "Lightweight dark-mode auto clicker for Windows with Minecraft Java hit mode"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 115
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
